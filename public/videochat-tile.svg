<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="vcBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101418"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="vcTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232a31"/>
      <stop offset="100%" stop-color="#14181d"/>
