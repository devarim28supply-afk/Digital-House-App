    <circle cx="226" cy="46" r="11"/><path d="M204 80 a22 18 0 0 1 44 0 z"/>
    <circle cx="94" cy="122.5" r="11"/><path d="M72 156.5 a22 18 0 0 1 44 0 z"/>
