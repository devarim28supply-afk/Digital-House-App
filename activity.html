<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkwood Activity</title>
<style>
  :root {
    --bg: #050505;
    --panel: #0d0f0e;
    --line: #1f2421;
    --text: #e5e7e6;
    --dim: #8b918e;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #facc15;
    --blue: #60a5fa;
    --violet: #c084fc;
    --mono: ui-monospace, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  header.top h1 { margin: 0; font: 600 20px var(--mono); }
  header.top h1::before { content: "› "; color: var(--green); }
  header.top a { color: var(--dim); text-decoration: none; }
  .updated { margin-left: auto; color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters button {
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { border-color: var(--green); color: var(--green); }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .person { display: flex; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .person img, .ev img { width: 36px; height: 36px; border-radius: 50%; background: #222; flex: none; }
  .person b { display: block; }
  .person small { color: var(--dim); font-size: 12px; }
  h2 { font: 600 13px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 10px; }
  .feed { display: flex; flex-direction: column; gap: 6px; }
  .ev { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .ev .what { min-width: 0; }
  .ev .line1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ev .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; color: var(--text); text-decoration: none; }
  .ev a.title:hover { text-decoration: underline; }
  .ev .meta { color: var(--dim); font-size: 12px; }
  .ev time { color: var(--dim); font-size: 12px; font-family: var(--mono); white-space: nowrap; }
  .tag { padding: 1px 8px; border-radius: 999px; font: 600 11px var(--mono); text-transform: uppercase; }
  .tag.commit { background: #14532d; color: #bbf7d0; }
  .tag.push { background: #1e3a8a; color: #bfdbfe; }
  .tag.deploy { background: #4c1d95; color: #e9d5ff; }
  .tag.pr { background: #713f12; color: #fef08a; }
  .state.READY { color: var(--green); }
  .state.ERROR, .state.CANCELED { color: var(--red); }
  .state.BUILDING, .state.QUEUED, .state.INITIALIZING { color: var(--yellow); }
  .proj { color: var(--dim); font-size: 12px; }
  .msg { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .msg.err { border-color: #7f1d1d; }
  .tag.action { background: #7f1d1d; color: #fecaca; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin: 3px 0; }
  .ai { padding: 0 7px; border-radius: 999px; font: 600 11px var(--mono); background: #1f2937; color: #d1d5db; }
  .ai-Claude { background: #3b2410; color: #fdba74; }
  .ai-Codex { background: #0f2a24; color: #6ee7b7; }
  .ai-Grok { background: #1e1b2e; color: #c4b5fd; }
  .ai-byhand { background: #262626; color: #d4d4d4; }
  .person small { display: block; }
  .person .areas { color: #a3a3a3; }
  .edit { margin-left: 8px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; }
  #editor-wrap { margin-bottom: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .people-edit { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .pe-row { display: grid; grid-template-columns: 1fr 1.4fr 1.4fr 1.6fr auto auto; gap: 6px; }
  .pe-row input { min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #000; color: var(--text); font: inherit; font-size: 13px; }
  .pe-row button, #editor-wrap > div > button, #editor button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #000; color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  .hint { margin: 0; color: var(--dim); font-size: 12px; }
  @media (max-width: 800px) { .pe-row { grid-template-columns: 1fr 1fr; } }
  /* the Commit & Deploy Lane, live */
  .lane { margin-bottom: 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .lane.held { border-color: #b91c1c; box-shadow: 0 0 0 1px #b91c1c55, 0 0 24px #b91c1c33; }
  .lane.clear { border-color: #166534; }
  .lane-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lane-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  .lane.held .lane-dot { background: #ef4444; box-shadow: 0 0 10px #ef4444; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .lane-title { font: 600 16px var(--mono); }
  .lane-top a { margin-left: auto; color: var(--dim); font-size: 12px; }
  .lane p { margin: 6px 0 0; color: var(--dim); font-size: 13px; }
  .lane p b { color: var(--text); }
  .lane ol { margin: 8px 0 0; padding-left: 22px; font-size: 13px; }
  .lane li { margin: 2px 0; }
  .lane .urgent { color: #fca5a5; font-weight: 600; }
  .embedded header.top h1, .embedded header.top a { display: none; }
  .embedded .wrap { padding-top: 12px; }
  /* in the Activity window: it still scrolls, without a scroll bar */
  html:has(body.embedded) { scrollbar-width: none; }
  html:has(body.embedded)::-webkit-scrollbar, .embedded::-webkit-scrollbar { display: none; }
  .more { margin-top: 10px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
  @media (max-width: 600px) { .ev { grid-template-columns: 28px 1fr; } .ev time { grid-column: 2; } .ev img { width: 28px; height: 28px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Activity</h1>
    <a href="./">← Darkwood Node</a>
    <span class="updated" id="updated"></span>
  </header>
  <section class="lane" id="lane" hidden></section>
  <div id="status" class="msg">Loading…</div>
  <div id="content" hidden>
    <div class="filters" id="projects"></div>
    <div class="filters" id="kinds"></div>
    <h2>Who did what (last 30 days) <button class="edit" id="edit-people" type="button">Who is who</button></h2>
    <div id="editor-wrap" hidden><div id="editor"></div><p class="hint" id="editor-msg"></p></div>
    <div class="people" id="people"></div>
    <h2>Timeline</h2>
    <div class="feed" id="feed"></div>
    <button class="more" id="more" type="button" hidden>Show more</button>
  </div>
</div>
<script type="module" src="/src/activity/activity.ts"></script>
</body>
</html>
