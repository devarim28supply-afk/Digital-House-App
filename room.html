<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkwood Room</title>
<style>
  /*
   * A room made of six flat HTML boxes turned in 3D by CSS: no WebGL, no
   * canvas, no animation loop. The page only moves when someone does.
   * Room size in px (100 px = 1 m): 6 m wide, 6 m deep, 3 m high.
   * Everyone in it is their webcam on a diamond (or hexagon) plate.
   * The look: Matrix rain. Every wall is black with columns of green
   * characters falling down it (CSS animations, nothing drawn by script),
   * between a glowing grid floor and ceiling.
   */
  :root {
    --w: 600px;
    --d: 600px;
    --h: 300px;
    --board: #03110a;
    --board-dark: #010805;
    --trace: #23ff9a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { font: 14px/1.4 system-ui, sans-serif; color: #fff; user-select: none; }

  /*
   * The room is the big screen, the whole window. The tile's videochat floats
   * over its bottom edge as small screens (up to 4 in a row, no bar behind
   * them); more than 4 stack in a column on the right, like the big-screen
   * layout in the videochat. --strip is the room they take at the bottom.
   */
  :root { --strip: 0px; --tile-h: clamp(80px, 18vh, 180px); }
  body.calling { --strip: calc(var(--tile-h) + 16px); }
  #view {
    position: fixed;
    inset: 0;
    cursor: grab;
    touch-action: none;
  }
  #view.locked { cursor: none; }
  #world, .face {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-style: preserve-3d;
  }
  .face { box-sizing: border-box; }

  /* walls face inward; each is centred on the room's middle, then pushed out */
  .wall {
    width: var(--w);
    height: var(--h);
    margin: calc(var(--h) / -2) 0 0 calc(var(--w) / -2);
    background:
      linear-gradient(to top, var(--trace) 0 2px, #23ff9a40 2px 6px, transparent 14px), /* glowing floor seam */
      linear-gradient(to bottom, var(--trace) 0 1px, #23ff9a30 1px 4px, transparent 10px), /* ceiling seam */
      #000;
    box-shadow: inset 0 0 60px #23ff9a14;
    /* no overflow clipping: a clipped wall is drawn as one flat 600 x 300
       picture, which blurs and blacks out what stands in front of it */
  }
  .side { width: var(--d); margin-left: calc(var(--d) / -2); }
  .front { transform: translateZ(calc(var(--d) / -2)); }
  .back  { transform: translateZ(calc(var(--d) / 2)) rotateY(180deg); }
  .left  { transform: translateX(calc(var(--w) / -2)) rotateY(90deg); }
  .right { transform: translateX(calc(var(--w) / 2)) rotateY(-90deg); }

  .floor, .ceiling {
    width: var(--w);
    height: var(--d);
    margin: calc(var(--d) / -2) 0 0 calc(var(--w) / -2);
  }
  .floor {
    transform: translateY(calc(var(--h) / 2)) rotateX(90deg);
    background:
      radial-gradient(circle at center, #23ff9a1f, transparent 60%),
      repeating-linear-gradient(to right, #23ff9a38 0 1px, transparent 1px 50px),
      repeating-linear-gradient(to bottom, #23ff9a38 0 1px, transparent 1px 50px),
      var(--board-dark);
  }
  .ceiling {
    transform: translateY(calc(var(--h) / -2)) rotateX(-90deg);
    background:
      radial-gradient(circle at center, #23ff9a55 0 30px, #23ff9a22 31px 34px, transparent 70px), /* light panel */
      repeating-linear-gradient(to right, #23ff9a1c 0 1px, transparent 1px 100px),
      repeating-linear-gradient(to bottom, #23ff9a1c 0 1px, transparent 1px 100px),
      var(--board-dark);
  }

  /*
   * Matrix rain: each wall gets columns of characters (made once by
   * room.js). A column falls from the top of the wall to the bottom (it
   * never leaves the wall), fading in and out, over and over at its own
   * speed: transform and opacity only, so the browser moves it without
   * repainting. The lowest character is the bright white head, the rest
   * fade up into the dark.
   */
  .drop {
    position: absolute;
    top: 0;
    width: 12px;
    font: 12px/1 "MS Gothic", ui-monospace, Consolas, monospace;
    text-align: center;
    white-space: pre;
    color: transparent;
    background: linear-gradient(to bottom, transparent, #0f8a45 40%, #3dff8f 92%, #eafff2 97%);
    -webkit-background-clip: text;
    background-clip: text;
    animation: fall var(--t, 6s) linear var(--delay, 0s) infinite;
    will-change: transform;
  }
  @keyframes fall {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: var(--o, 1); }
    80% { opacity: var(--o, 1); }
    100% { transform: translateY(var(--travel, 0px)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .drop { animation-play-state: paused; } }

  /* a monitor (4.5 x 2.5 m) just off the wall, centred on it: a shared screen */
  .monitor {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 448px;
    height: 252px;
    margin: -126px 0 0 -224px;
    box-sizing: border-box;
    border: 5px solid #0c0f0d;
    outline: 1px solid #23ff9a66;
    border-radius: 4px;
    background: #000;
    box-shadow: 0 0 30px #23ff9a40;
    display: grid;
    place-items: center;
  }
  .monitor video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .monitor:not(.on) video { display: none; }
  .monitor .idle {
    font: 14px/1.6 ui-monospace, Consolas, monospace;
    color: var(--trace);
    text-align: center;
    white-space: pre;
    opacity: .7;
  }
  .monitor.on .idle { display: none; }
  .monitor .label {
    position: absolute;
    left: 4px;
    bottom: 4px;
    padding: 0 4px;
    border-radius: 2px;
    background: #000b;
    font-size: 9px;
    color: #cfe;
  }
  .monitor .label:empty { display: none; }

  /* F: the screen you face, full size */
  #bigscreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000e;
    display: grid;
    place-items: center;
    cursor: zoom-out;
  }
  #bigscreen[hidden] { display: none; }
  #bigscreen video { width: 100%; height: 100%; object-fit: contain; }
  #bigscreen .label {
    position: absolute;
    left: 12px;
    bottom: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    background: #000b;
  }

  /*
   * A person: their webcam on a 16:9 plate (640 x 360), cut to a diamond or
   * a hexagon by clip-path. Both shapes have the same six corners in the
   * same order (the diamond's flat top and bottom squeezed to a point), so
   * the browser slides every corner from one shape to the other.
   * The name floats above, readable from the front and from behind.
   */
  .avatar {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 640px;
    height: 360px;
    margin: -180px 0 0 -320px;
    transform-style: preserve-3d;
  }
  .avatar.hidden { display: none; }
  .plate {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #1c1c22;
    transition: clip-path .4s ease;
    clip-path: polygon(50% 0, 50% 0, 69.4% 50%, 50% 100%, 50% 100%, 30.6% 50%);
    backface-visibility: hidden; /* the webcam shows on the front only */
  }
  /* the back: the same shape in black, with the username in the middle */
  .plate-back {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: #000;
    transform: rotateY(180deg);
    backface-visibility: hidden;
    transition: clip-path .4s ease;
    clip-path: polygon(50% 0, 50% 0, 69.4% 50%, 50% 100%, 50% 100%, 30.6% 50%);
  }
  .plate-back span {
    max-width: 210px; /* the diamond is ~248 px wide across its middle */
    font-size: 40px;
    font-weight: 600;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: max-width .4s ease;
  }
  .avatar.hexagon .plate,
  .avatar.hexagon .plate-back { clip-path: polygon(14% 0, 86% 0, 100% 50%, 86% 100%, 14% 100%, 0 50%); }
  .avatar.hexagon .plate-back span { max-width: 520px; }
  /* face tracking slides and zooms the picture inside the plate */
  .plate video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform-origin: 0 0;
  }
  .plate .off {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 40px;
    color: #fff8;
  }
  .avatar.live .off { display: none; }
  .avatar:not(.live) video { visibility: hidden; }
  .tag {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    margin-bottom: 14px;
    text-align: center;
    font-size: 52px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 2px 6px #000c;
    white-space: nowrap;
    backface-visibility: hidden;
  }
  /* each name needs its own 3D placement, or the browser loses it */
  .tag.front { transform: translateZ(0.5px); }
  .tag.back { transform: rotateY(180deg) translateZ(0.5px); }

  #bar {
    position: fixed;
    top: 12px;
    left: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  #bar button, #status a {
    font: inherit;
    color: #fff;
    background: #000a;
    border: 1px solid #fff3;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    text-decoration: none;
  }
  #bar button[aria-pressed="true"] { border-color: #7fe0b4; color: #7fe0b4; }
  #bar button:disabled { opacity: .45; cursor: default; }

  #fov {
    position: fixed;
    top: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 8px;
    background: #000a;
  }
  #fov input { width: 120px; }
  #fov output { min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }

  #strip, #side {
    position: fixed;
    display: flex;
    gap: 8px;
    pointer-events: none;
  }
  #strip {
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--strip);
    padding: 8px;
    box-sizing: border-box;
    justify-content: center;
  }
  #side {
    top: 56px;
    right: 8px;
    bottom: calc(var(--strip) + 8px);
    flex-direction: column;
    overflow: hidden;
  }
  .call-tile {
    position: relative;
    height: var(--tile-h);
    aspect-ratio: 16 / 9;
    flex: none;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    display: grid;
    place-items: center;
  }
  .call-tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .call-tile:not(.live) video { display: none; }
  /* camera off: black with their username in the middle */
  .call-tile .name {
    max-width: 90%;
    font-size: clamp(12px, calc(var(--tile-h) * .14), 22px);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .call-tile.live .name { display: none; }
  .call-tile:not(.live) .who { display: none; }
  .call-tile .who {
    position: absolute;
    left: 6px;
    bottom: 6px;
    padding: 1px 6px;
    border-radius: 4px;
    background: #000a;
    font-size: 12px;
    max-width: calc(100% - 12px);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  @media (max-width: 700px) { :root { --tile-h: clamp(60px, 14vh, 120px); } }

  #status {
    position: fixed;
    left: 12px;
    bottom: calc(var(--strip) + 12px);
    padding: 6px 10px;
    border-radius: 8px;
    background: #000a;
  }
  #status:empty { display: none; }
  #status.problem {
    left: 50%;
    top: 50%;
    bottom: auto;
    transform: translate(-50%, -50%);
    padding: 16px 20px;
    text-align: center;
    max-width: min(420px, calc(100vw - 32px));
    box-sizing: border-box;
  }
  #status.problem a { display: inline-block; margin-top: 10px; }

  #hint {
    position: fixed;
    left: 50%;
    bottom: calc(var(--strip) + 16px);
    transform: translateX(-50%);
    padding: 8px 14px;
    border-radius: 8px;
    background: #000a;
    text-align: center;
    pointer-events: none;
    transition: opacity .3s;
    max-width: calc(100vw - 32px);
    box-sizing: border-box;
  }
  #view.locked ~ #hint { opacity: 0; }
  @media (max-width: 700px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="view">
  <div id="world">
    <div class="face wall front"></div>
    <div class="face wall back"></div>
    <div class="face wall side left"></div>
    <div class="face wall side right"></div>
    <div class="face floor"></div>
    <div class="face ceiling"></div>
  </div>
</div>
<div id="bar">
  <button type="button" id="cam" aria-pressed="false">Camera (C)</button>
  <button type="button" id="shape">Hexagon (G)</button>
  <button type="button" id="pov">First person (V)</button>
</div>
<label id="fov">FOV <input type="range" min="60" max="120" step="1" value="90"> <output>90</output>°</label>
<div id="strip"></div>
<div id="side"></div>
<div id="bigscreen" hidden><video autoplay muted playsinline></video><div class="label"></div></div>
<div id="status"></div>
<div id="hint">Click to look around (Esc to let go) · W A S D or arrows to walk · C camera · G diamond/hexagon · V first/third person · 1 / 2 share your screen · F view a screen big · [ and ] FOV · on a phone, drag to look</div>
<script type="module" src="/src/room/room.js"></script>
</body>
</html>
